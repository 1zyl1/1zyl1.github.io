<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Animation</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        #text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="text-container"></div>
    <audio id="bg-music" preload="auto">
        <source src="Paper Rings-Taylor Swift.mp3" type="audio/mpeg">
    </audio>
    <script src="scripts/main.js"></script>
    <script src="scripts/simple-image-animation.js"></script>
    <script src="scripts/text-animation.js"></script>
</body>
</html>
