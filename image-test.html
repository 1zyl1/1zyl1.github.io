<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片测试</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        #test-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #test-image {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1000ms ease-out, transform 1000ms ease-out;
        }
    </style>
</head>
<body>
    <div id="test-container">
        <img id="test-image" src="dg.png" alt="图片">
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，准备显示图片');
            const img = document.getElementById('test-image');
            
            img.onload = function() {
                console.log('图片加载成功');
                setTimeout(() => {
                    img.style.opacity = '1';
                    img.style.transform = 'scale(1)';
                    console.log('图片动画开始');
                }, 1000);
            };
            
            img.onerror = function() {
                console.error('图片加载失败');
            };
        });
    </script>
</body>
</html>
